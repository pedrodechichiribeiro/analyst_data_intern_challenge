# docker-compose.yml — base neutra de SO.
# O que é específico de plataforma está nos arquivos de override.
# Instruções de execução: README_DOCKER.md

services:
  dashboard:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: analyst-dashboard:latest
    container_name: analyst_dashboard

    user: "${UID:-1000}:${GID:-1000}"

    environment:
      # Sem fallback silencioso. Se DISPLAY não estiver definido o compose
      # falha aqui, com mensagem útil, em vez de o container subir e a
      # janela nunca aparecer.
      - DISPLAY=${DISPLAY:?defina DISPLAY antes de subir. Ver README_DOCKER.md}

      # Interpolado a partir do .env da raiz, que o Compose já lê
      # automaticamente. Não uso `env_file` porque ele exigiria que o
      # arquivo existisse e derrubaria o `up` com um erro de arquivo
      # ausente, nada a ver com a chave.
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}